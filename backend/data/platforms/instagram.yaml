# Instagram — platform settings version 1 (seed). Every value carries a source label.
# official_spec values: VERIFY against Meta's current official ad specs before launch
# (https://www.facebook.com/business/ads-guide) — specs change regularly.
platform: instagram
name: Instagram
status: full
version: 1
change_note: "Initial seed"
global:
  placements:
    feed:
      formats: [image, video]
      ratios: ["1:1", "4:5"]
      video_s: [1, 60]
      max_caption_chars: 125
      source: official_spec        # VERIFY against current official ad specs
    stories:
      formats: [image, video]
      ratios: ["9:16"]
      video_s: [1, 60]
      max_caption_chars: 125
      source: official_spec        # VERIFY against current official ad specs
    reels:
      formats: [video]
      ratios: ["9:16"]
      video_s: [3, 90]
      max_caption_chars: 72
      source: official_spec        # VERIFY against current official ad specs
    explore:
      formats: [image, video]
      ratios: ["1:1", "4:5"]
      video_s: [1, 60]
      max_caption_chars: 125
      source: official_spec        # VERIFY against current official ad specs
  behavior:
    autoplay: true                 # source: official_spec
    sound_default: "off"           # source: official_spec
    avg_seconds_per_post: 1.4      # source: estimate_calibrate
    hook_window_s: 2.5             # source: estimate_calibrate
    fatigue_rate: 0.4              # source: estimate_calibrate
    frequency_cap_per_day: 3       # source: estimate_calibrate
    sponsored_penalty: 0.2         # source: estimate_calibrate
    caption_visibility: 0.6        # source: estimate_calibrate (caption is below the image, often truncated)
    sessions_per_day: 8            # source: estimate_calibrate
  organic:
    reach_rate_of_followers: 0.09  # source: estimate_calibrate
    decay_half_life_h: 6           # source: estimate_calibrate
    share_boost: 0.3               # source: estimate_calibrate
    ranking_engagement_weight: 0.7 # source: estimate_calibrate
  actions: [like, comment, share, save, click, message]
  supported_goals:
    paid: [sales, messages, traffic, awareness, engagement]
    boosted: [messages, traffic, awareness, engagement]
    organic: [awareness, engagement, messages]

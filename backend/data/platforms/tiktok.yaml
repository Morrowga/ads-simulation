# TikTok — platform settings version 1 (seed), status beta. Every value carries a source label.
# official_spec values: VERIFY against TikTok's current official ad specs before launch
# (https://ads.tiktok.com/help/) — specs change regularly.
platform: tiktok
name: TikTok
status: beta
version: 1
change_note: "Initial seed (beta: not yet compared with pilot campaigns)"
global:
  placements:
    in_feed:
      formats: [video]
      ratios: ["9:16"]
      video_s: [5, 60]
      max_caption_chars: 100
      source: official_spec        # VERIFY against current official ad specs
    top_view:
      formats: [video]
      ratios: ["9:16"]
      video_s: [5, 60]
      max_caption_chars: 100
      source: official_spec        # VERIFY against current official ad specs
  behavior:
    autoplay: true                 # source: official_spec
    sound_default: "on"            # source: official_spec (audio features weigh more in the crowd brain)
    avg_seconds_per_post: 1.1      # source: estimate_calibrate
    hook_window_s: 2.0             # source: estimate_calibrate
    fatigue_rate: 0.5              # source: estimate_calibrate
    frequency_cap_per_day: 2       # source: estimate_calibrate
    sponsored_penalty: 0.3         # source: estimate_calibrate
    caption_visibility: 0.5        # source: estimate_calibrate
    sessions_per_day: 9            # source: estimate_calibrate
  organic:
    reach_rate_of_followers: 0.12  # source: estimate_calibrate
    decay_half_life_h: 12          # source: estimate_calibrate (discovery feed keeps posts alive longer)
    share_boost: 0.4               # source: estimate_calibrate
    ranking_engagement_weight: 0.9 # source: estimate_calibrate
  actions: [like, comment, share, save, follow, click, message]
  supported_goals:
    paid: [sales, messages, traffic, awareness, engagement]
    boosted: [traffic, awareness, engagement]
    organic: [awareness, engagement]

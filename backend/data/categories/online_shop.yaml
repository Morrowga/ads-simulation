# Online shop (general e-commerce) category template. Published as version 2 by scripts/seed.py.
code: online_shop
name: Online shop
parent_code: null
tags: [shopping, ecommerce, online_shop]
version: 2
change_note: "Reorder basics under price level; customer_mix multiselect; add mixed/global language option"
questions:
  - { key: business_name, label: "Shop name", type: text, required: true }
  - key: product_category
    label: "Main product category"
    type: select
    required: true
    options: [electronics, home_living, gadgets, toys, pet_supplies, groceries, health, sports, books, other]
  - { key: what_you_sell, label: "What do you sell? (short description)", type: text, required: true }
  - key: price_level
    label: "Price level"
    type: select
    required: true
    options: [budget, mid, premium]
    feeds_trait: price_level
  - { key: free_shipping, label: "Free shipping?", type: boolean, required: false, default: false }
  - { key: cash_on_delivery, label: "Cash on delivery?", type: boolean, required: false, default: false }
  - key: sales_channel
    label: "How do customers buy?"
    type: multiselect
    required: true
    options: [website, marketplace, chat_order, app]
  - key: value_profile
    label: "What your shop is known for"
    type: sliders
    required: true
    options: [bargain, quality, novelty, convenience]
    min: 0
    max: 1
    default: { bargain: 0.5, quality: 0.5, novelty: 0.4, convenience: 0.5 }
    feeds_trait: taste
    help: "0 = none, 1 = very strong"
  - key: customer_mix
    label: "Who are your customers?"
    type: multiselect
    required: true
    options: [bargain_hunters, families, young_adults, professionals, mixed]
    feeds_trait: familiarity
    help: "Your actual, existing customers today (not who you want this ad to reach). Pick all that apply."
  - key: customer_languages
    label: "Languages your customers use"
    type: multiselect
    required: false
    options: [th, en, my, zh, ja, ko, es, mixed]
    feeds_trait: language_group
    help: "The languages your existing customers speak today (not the ad's target audience). Pick 'Mixed' if you get a broad international mix."
  - { key: followers, label: "Followers on your page (this platform)", type: number, required: true, min: 0, max: 50000000, default: 0, feeds_trait: brand_relationship, help: "Your current follower count on the platform you're testing on, e.g. Facebook/Instagram page followers." }
  - { key: review_count, label: "Number of public reviews", type: number, required: false, min: 0, max: 1000000, default: 0, feeds_trait: brand_relationship }
  - { key: rating, label: "Average rating (1-5)", type: number, required: false, min: 1, max: 5, feeds_trait: brand_relationship }
  - { key: months_in_business, label: "Months in business", type: number, required: false, min: 0, max: 1200, default: 0, feeds_trait: brand_relationship }
trait_dimensions:
  - key: taste
    label: "Shopping values"
    kind: vector
    values: [bargain, quality, novelty, convenience]
    default_distribution:
      bargain: { mean: 0.6, sd: 0.2 }
      quality: { mean: 0.55, sd: 0.2 }
      novelty: { mean: 0.45, sd: 0.22 }
      convenience: { mean: 0.6, sd: 0.2 }
    familiarity_shift: { grew_up_with_it: 0.05, tried_elsewhere: 0.0, foreigner_likes_it: 0.0, never_tried: -0.1 }
  - key: familiarity
    label: "Familiarity with buying this online"
    kind: categorical
    values: [grew_up_with_it, tried_elsewhere, foreigner_likes_it, never_tried]
    from_question: customer_mix
  - key: brand_relationship
    label: "Brand relationship"
    kind: reputation
    values: [unaware, aware_not_tried, tried_liked, tried_disliked, regular]
activation_rules:
  - { ad_feature: "price_shown", trait: "price_sensitivity", weight: 0.8 }
  - { ad_feature: "discount_pct", trait: "price_sensitivity", weight: 0.9 }
  - { ad_feature: "trust_signals", trait: "skepticism", weight: 0.85 }
  - { ad_feature: "hook_strength", trait: "patience", weight: 0.9 }
default_mixes:
  bargain_hunters: { grew_up_with_it: 0.6, tried_elsewhere: 0.3, foreigner_likes_it: 0.02, never_tried: 0.08 }
  families: { grew_up_with_it: 0.5, tried_elsewhere: 0.35, foreigner_likes_it: 0.03, never_tried: 0.12 }
  young_adults: { grew_up_with_it: 0.65, tried_elsewhere: 0.25, foreigner_likes_it: 0.03, never_tried: 0.07 }
  professionals: { grew_up_with_it: 0.55, tried_elsewhere: 0.35, foreigner_likes_it: 0.05, never_tried: 0.05 }
  mixed: { grew_up_with_it: 0.5, tried_elsewhere: 0.3, foreigner_likes_it: 0.05, never_tried: 0.15 }
buying_behavior: { impulse_share: 0.5, planned_share: 0.5, repeat_rate: 0.3, price_sensitivity: 0.7, decision_time_h: 12, typical_basket_usd: 20 }
blockers:
  - { code: trust, label: "Shop trust / scam worry", weight: 0.3 }
  - { code: price, label: "Price", weight: 0.3 }
  - { code: shipping, label: "Shipping cost / time", weight: 0.25 }
  - { code: relevance, label: "Do not need it", weight: 0.1 }
  - { code: size, label: "Specs / size unclear", weight: 0.05 }
trust_signals:
  - { code: reviews, label: "Reviews visible", weight: 0.9 }
  - { code: cash_on_delivery, label: "Cash on delivery", weight: 0.8 }
  - { code: free_shipping, label: "Free shipping", weight: 0.8 }
  - { code: guarantee, label: "Guarantee / returns", weight: 0.75 }
  - { code: official_store, label: "Official store badge", weight: 0.7 }
  - { code: price_shown, label: "Price shown", weight: 0.7 }
comment_topics: [price, product_detail, service, positive, negative, other]
typical_goals: [sales, traffic, messages]
analyzer_hints:
  look_for: [product, price, discount, shipping offer, delivery time, guarantee, packaging, unboxing]
  taste_dimensions: [bargain, quality, novelty, convenience]
  interest_tags: [shopping, ecommerce]
benchmark_adjustments: { ctr: 1.15, cvr: 1.1, message_rate: 1.2 }
calendar:
  peaks:
    - { name: evening, hours: [20, 21, 22, 23], boost: 1.3 }
  seasons:
    - { name: "double-digit sales", months: [9, 10, 11, 12], boost: 1.15 }
restrictions:
  regulated_goods: "Some goods (supplements, electronics with batteries) have platform restrictions."
country_overrides:
  MM:
    benchmark_adjustments: { message_rate: 2.5, cvr: 0.7 }
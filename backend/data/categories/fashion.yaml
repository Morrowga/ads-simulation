# Fashion category template. Published as version 2 by scripts/seed.py.
code: fashion
name: Fashion & apparel
parent_code: null
tags: [fashion, clothing, shopping, style]
version: 2
change_note: "Reorder basics under price level; customer_mix multiselect; add mixed/global language option"
questions:
  - { key: business_name, label: "Brand or shop name", type: text, required: true }
  - key: product_type
    label: "Main products"
    type: multiselect
    required: true
    options: [womens_clothing, mens_clothing, kids, shoes, bags, accessories, sportswear, jewellery]
  - { key: what_you_sell, label: "What do you sell? (short description)", type: text, required: true }
  - key: price_level
    label: "Price level"
    type: select
    required: true
    options: [budget, mid, premium, luxury]
    feeds_trait: price_level
  - { key: free_shipping, label: "Free shipping?", type: boolean, required: false, default: false }
  - { key: returns, label: "Returns accepted?", type: boolean, required: false, default: false }
  - key: sales_channel
    label: "How do customers buy?"
    type: multiselect
    required: true
    options: [online_shop, marketplace, chat_order, physical_store]
  - key: style_profile
    label: "Style profile"
    type: sliders
    required: true
    options: [trendy, classic, bold, minimal]
    min: 0
    max: 1
    default: { trendy: 0.5, classic: 0.4, bold: 0.4, minimal: 0.4 }
    feeds_trait: taste
    help: "0 = none, 1 = very strong"
  - key: customer_mix
    label: "Who are your customers?"
    type: multiselect
    required: true
    options: [young_locals, working_adults, mixed, parents, tourists]
    feeds_trait: familiarity
    help: "Your actual, existing customers today (not who you want this ad to reach). Pick all that apply."
  - key: customer_languages
    label: "Languages your customers use"
    type: multiselect
    required: false
    options: [th, en, my, zh, ja, ko, es, mixed]
    feeds_trait: language_group
    help: "The languages your existing customers speak today (not the ad's target audience). Pick 'Mixed' if you get a broad international mix."
  - { key: followers, label: "Followers on your page (this platform)", type: number, required: true, min: 0, max: 50000000, default: 0, feeds_trait: brand_relationship, help: "Your current follower count on the platform you're testing on, e.g. Facebook/Instagram page followers." }
  - { key: review_count, label: "Number of public reviews", type: number, required: false, min: 0, max: 1000000, default: 0, feeds_trait: brand_relationship }
  - { key: rating, label: "Average rating (1-5)", type: number, required: false, min: 1, max: 5, feeds_trait: brand_relationship }
  - { key: months_in_business, label: "Months in business", type: number, required: false, min: 0, max: 1200, default: 0, feeds_trait: brand_relationship }
trait_dimensions:
  - key: taste
    label: "Style taste"
    kind: vector
    values: [trendy, classic, bold, minimal]
    default_distribution:
      trendy: { mean: 0.55, sd: 0.22 }
      classic: { mean: 0.5, sd: 0.2 }
      bold: { mean: 0.4, sd: 0.22 }
      minimal: { mean: 0.45, sd: 0.2 }
    familiarity_shift: { grew_up_with_it: 0.05, tried_elsewhere: 0.0, foreigner_likes_it: 0.0, never_tried: -0.1 }
  - key: familiarity
    label: "Familiarity with the brand's style"
    kind: categorical
    values: [grew_up_with_it, tried_elsewhere, foreigner_likes_it, never_tried]
    from_question: customer_mix
  - key: brand_relationship
    label: "Brand relationship"
    kind: reputation
    values: [unaware, aware_not_tried, tried_liked, tried_disliked, regular]
activation_rules:
  - { ad_feature: "visual_quality", trait: "openness", weight: 0.8 }
  - { ad_feature: "price_shown", trait: "price_sensitivity", weight: 0.7 }
  - { ad_feature: "discount_pct", trait: "price_sensitivity", weight: 0.9 }
  - { ad_feature: "trust_signals", trait: "skepticism", weight: 0.8 }
  - { ad_feature: "hook_strength", trait: "patience", weight: 0.9 }
default_mixes:
  young_locals: { grew_up_with_it: 0.5, tried_elsewhere: 0.35, foreigner_likes_it: 0.05, never_tried: 0.1 }
  working_adults: { grew_up_with_it: 0.45, tried_elsewhere: 0.4, foreigner_likes_it: 0.05, never_tried: 0.1 }
  mixed: { grew_up_with_it: 0.4, tried_elsewhere: 0.35, foreigner_likes_it: 0.1, never_tried: 0.15 }
  parents: { grew_up_with_it: 0.45, tried_elsewhere: 0.4, foreigner_likes_it: 0.03, never_tried: 0.12 }
  tourists: { grew_up_with_it: 0.2, tried_elsewhere: 0.3, foreigner_likes_it: 0.3, never_tried: 0.2 }
buying_behavior: { impulse_share: 0.45, planned_share: 0.55, repeat_rate: 0.25, price_sensitivity: 0.65, decision_time_h: 24, typical_basket_usd: 25 }
blockers:
  - { code: price, label: "Price", weight: 0.3 }
  - { code: size, label: "Size / fit uncertainty", weight: 0.3 }
  - { code: trust, label: "Shop trust / fake product", weight: 0.2 }
  - { code: shipping, label: "Shipping cost / time", weight: 0.15 }
  - { code: relevance, label: "Not my style", weight: 0.05 }
trust_signals:
  - { code: reviews, label: "Reviews visible", weight: 0.9 }
  - { code: photos_of_real_product, label: "Real product photos / try-on", weight: 0.85 }
  - { code: free_shipping, label: "Free shipping", weight: 0.75 }
  - { code: guarantee, label: "Returns / guarantee", weight: 0.7 }
  - { code: price_shown, label: "Price shown", weight: 0.7 }
  - { code: cash_on_delivery, label: "Cash on delivery", weight: 0.6 }
comment_topics: [price, product_detail, service, positive, negative, other]
typical_goals: [sales, traffic, messages, engagement]
analyzer_hints:
  look_for: [garment on a person, fabric close-up, size chart, price, discount, shipping info, colour options, model diversity]
  taste_dimensions: [trendy, classic, bold, minimal]
  interest_tags: [fashion, clothing, shopping, style]
benchmark_adjustments: { ctr: 1.2, cvr: 1.0, save_rate: 1.5, message_rate: 1.3 }
calendar:
  peaks:
    - { name: evening, hours: [19, 20, 21, 22], boost: 1.3 }
  seasons:
    - { name: "sale season", months: [11, 12], boost: 1.2 }
restrictions:
  counterfeit: "Branded goods require authorisation; check platform policy."
country_overrides:
  MM:
    benchmark_adjustments: { message_rate: 2.2, cvr: 0.8 }
    trust_signals:
      - { code: cash_on_delivery, label: "Cash on delivery", weight: 0.9 }
      - { code: phone_number, label: "Phone number", weight: 0.8 }
      - { code: photos_of_real_product, label: "Real product photos", weight: 0.85 }
      - { code: price_shown, label: "Price shown", weight: 0.85 }
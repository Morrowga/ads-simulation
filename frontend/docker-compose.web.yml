# ADVAR frontend `web` service.
# Either merge the `web` service and the `frontend_node_modules` volume into the root docker-compose.yml
# (see README.md, "Docker") or run it as an overlay:
#   docker compose -f docker-compose.yml -f frontend/docker-compose.web.yml up -d
services:
  web:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_STRIPE_MODE: ${NEXT_PUBLIC_STRIPE_MODE:-test}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # `npm run gen:api` inside the container reaches the API by service name
      OPENAPI_URL: http://api:8000/openapi.json
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api

volumes:
  frontend_node_modules:
  frontend_next:
